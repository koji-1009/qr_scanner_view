name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@26fb6927d2874fcc9b3af19cb4cf5cd66ec18a28 # v1.3.0
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: koji-1009/setup-flutter@26fb6927d2874fcc9b3af19cb4cf5cd66ec18a28 # v1.3.0
      - run: flutter build apk --debug
        working-directory: example
      - name: Native unit tests
        run: ./gradlew :qr_scanner_view:testDebugUnitTest
        working-directory: example/android

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@26fb6927d2874fcc9b3af19cb4cf5cd66ec18a28 # v1.3.0
      - run: flutter build ios --no-codesign --debug
        working-directory: example
      - run: flutter build ios --debug --simulator
        working-directory: example
      - name: Native unit tests
        run: |
          UDID=$(xcrun simctl list devices available --json |
            jq -r '[.devices[][] | select(.isAvailable)][0].udid')
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "id=$UDID" -quiet
        working-directory: example/ios
