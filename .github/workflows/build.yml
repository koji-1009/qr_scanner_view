name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - run: flutter build apk --debug
        working-directory: example
      - name: Native unit tests
        run: ./gradlew :qr_scanner_view:testDebugUnitTest
        working-directory: example/android

  build_ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - run: flutter build ios --config-only --simulator
        working-directory: example
      - uses: koji-1009/boot-simctl@59420d2a1284d7c4227e19e9bab3e11172c883a4 # v1.2.1
        with:
          device: iPhone
      - name: Native unit tests
        run: |
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "id=$SIMULATOR_UDID" -quiet
        working-directory: example/ios
